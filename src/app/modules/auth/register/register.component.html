<div class="auth-page">
  <nav class="auth-nav">
    <img src="assets/logo-removebg-preview.png" alt="Logo" class="logo" routerLink="/">
    <div class="nav-btns">
      <button class="btn-green" routerLink="/auth/login">Se connecter</button>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-content">
      <h1>Créer un compte</h1>
      <p class="subtitle">Rejoignez la communauté louage !</p>

      <div class="role-selector">
        <div class="role-card" [class.active]="selectedRole === Role.PASSENGER" (click)="setRole(Role.PASSENGER)">
          <i class="fas fa-user"></i>
          <span>Passager</span>
        </div>
        <div class="role-card" [class.active]="selectedRole === Role.DRIVER" (click)="setRole(Role.DRIVER)">
          <i class="fas fa-bus"></i>
          <span>Chauffeur</span>
        </div>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">

        <div class="input-group">
          <label>Nom complet</label>
          <div class="input-wrapper">
            <i class="far fa-user"></i>
            <input type="text" formControlName="fullName" placeholder="Nom complet">
          </div>
        </div>

        <div class="input-group">
          <label>Adresse email</label>
          <div class="input-wrapper">
            <i class="far fa-envelope"></i>
            <input type="email" formControlName="email" placeholder="Email132@gmail.com">
          </div>
        </div>

        <!-- TÉLÉPHONE AVEC DRAPEAUX -->
        <div class="input-group">
          <label>Téléphone</label>
          <div class="input-wrapper phone-wrapper">
            <i class="fas fa-phone-alt"></i>

            <div class="country-dropdown" (click)="$event.stopPropagation()">
              <div class="country-trigger" (click)="toggleDropdown()">
                <img
                  [src]="'https://flagcdn.com/w20/' + getSelectedCountry().iso + '.png'"
                  [alt]="getSelectedCountry().name"
                  class="flag-img"
                />
                <span class="trigger-code">{{ getSelectedCountry().code }}</span>
                <i class="fas fa-chevron-down"></i>
              </div>

              <div class="country-list" *ngIf="dropdownOpen">
                <div
                  class="country-option"
                  *ngFor="let c of countries"
                  (click)="selectCountry(c)"
                >
                  <img
                    [src]="'https://flagcdn.com/w20/' + c.iso + '.png'"
                    [alt]="c.name"
                    class="flag-img"
                  />
                  <span class="option-code">{{ c.code }}</span>
                  <span class="option-name">{{ c.name }}</span>
                </div>
              </div>
            </div>

            <div class="phone-separator"></div>

            <input type="tel" formControlName="phoneNumber" placeholder="XXXXXXXX">
          </div>
        </div>

        <div class="input-group">
          <label>Mot de passe</label>
          <div class="input-wrapper password-wrapper">
            <i class="fas fa-key"></i>
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="Mot de passe"
            >
            <button
              type="button"
              class="toggle-password"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            >
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- CONFIRMER MOT DE PASSE avec toggle -->
        <div class="input-group">
          <label>Confirmer votre mot de passe</label>
          <div class="input-wrapper password-wrapper">
            <i class="fas fa-key"></i>
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              formControlName="confirmPassword"
              placeholder="Confirmation de mot de passe"
            >
            <button
              type="button"
              class="toggle-password"
              (click)="showConfirmPassword = !showConfirmPassword"
              [attr.aria-label]="showConfirmPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            >
              <svg *ngIf="!showConfirmPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showConfirmPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit" [disabled]="loading">
          {{ loading ? 'Création en cours...' : 'Créer mon compte' }}
        </button>

        <p class="auth-link">Vous avez un compte ? <a routerLink="/auth/login">Connectez-vous !</a></p>
      </form>
    </div>
  </div>
</div>
