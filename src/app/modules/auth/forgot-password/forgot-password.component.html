<div class="auth-page modern">
  <div class="auth-background">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
  </div>

  <div class="auth-container">
    <div class="glass-card">

      <div class="step-indicator">
        <div class="step" [class.active]="step === 'email'" [class.completed]="step === 'code'">
          <div class="step-circle">1</div>
          <span>Email</span>
        </div>
        <div class="step-line"></div>
        <div class="step" [class.active]="step === 'code'">
          <div class="step-circle">2</div>
          <span>Code</span>
        </div>
      </div>

      <!-- ÉTAPE 1 : Email -->
      <div class="form-step" *ngIf="step === 'email'">
        <div class="step-header">
          <h1>Mot de passe oublié</h1>
          <p class="subtitle">Saisissez votre email pour recevoir un code de vérification à 6 chiffres.</p>
        </div>

        <form [formGroup]="emailForm" (ngSubmit)="onSubmitEmail()" class="auth-form">
          <div class="floating-input-group">
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
              <input
                type="email"
                formControlName="email"
                id="email"
                placeholder=" "
                [class.has-error]="emailForm.get('email')?.invalid && emailForm.get('email')?.touched"
              >
              <label for="email">Adresse email</label>
            </div>
            <div *ngIf="emailForm.get('email')?.invalid && emailForm.get('email')?.touched" class="error-hint">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
              Veuillez saisir un email valide.
            </div>
          </div>

          <button type="submit" class="btn-submit" [disabled]="loading || emailForm.invalid">
            <span class="btn-content" *ngIf="!loading">
              <span>Recevoir le code</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
                <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
              </svg>
            </span>
            <span class="spinner" *ngIf="loading"></span>
          </button>
        </form>
      </div>

      <!-- ÉTAPE 2 : Code 6 chiffres -->
      <div class="form-step" *ngIf="step === 'code'">
        <div class="step-header">
          <h1>Vérification</h1>
          <p class="subtitle">
            Entrez le code à 6 chiffres envoyé à <strong class="email-highlight">{{ userEmail }}</strong>
          </p>
        </div>

        <form [formGroup]="codeForm" (ngSubmit)="onSubmitCode()" class="auth-form">
          <div class="code-input-group">
            <div class="code-wrapper">
              <svg class="input-icon lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input
                type="text"
                inputmode="numeric"
                pattern="\d*"
                maxlength="6"
                formControlName="code"
                id="code"
                placeholder="••••••"
                class="code-input"
                autocomplete="one-time-code"
              >
            </div>
            <div class="code-hint">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              Code à 6 chiffres
            </div>
          </div>

          <button type="submit" class="btn-submit" [disabled]="loading || codeForm.invalid">
            <span class="btn-content">
              <span>Vérifier le code</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </span>
          </button>

          <button type="button" class="btn-link" (click)="resendCode()" [disabled]="loading">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
            </svg>
            Renvoyer le code
          </button>
        </form>
      </div>

      <div class="auth-footer">
        <a routerLink="/auth/login" class="back-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
          </svg>
          Retour à la connexion
        </a>
      </div>

    </div>
  </div>
</div>
