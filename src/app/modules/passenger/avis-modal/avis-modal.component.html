<div class="modal-overlay" (click)="close.emit()">
  <div class="modal-content card shadow" (click)="$event.stopPropagation()" style="max-width:420px;margin:auto;">
    <div class="card-header bg-warning text-dark d-flex justify-content-between">
      <h5 class="mb-0"><i class="bi bi-star me-2"></i>Laisser un avis</h5>
      <button class="btn-close" (click)="close.emit()"></button>
    </div>
    <div class="card-body">
      <form [formGroup]="avisForm" (ngSubmit)="onSubmit()">
        <div class="mb-3 text-center">
          <label class="form-label d-block">Note</label>
          <div class="d-flex justify-content-center gap-2 fs-3">
            <span *ngFor="let s of stars" (click)="setRating(s)" style="cursor:pointer;"
                  [class.text-warning]="avisForm.value.rating >= s"
                  [class.text-secondary]="avisForm.value.rating < s">★</span>
          </div>
          <small class="text-muted">{{ avisForm.value.rating }} / 5</small>
        </div>
        <div class="mb-3">
          <label class="form-label">Commentaire (optionnel)</label>
          <textarea formControlName="comment" class="form-control" rows="3"
                    placeholder="Partagez votre expérience..."></textarea>
        </div>
        <div *ngIf="errorMessage" class="alert alert-danger py-2">{{ errorMessage }}</div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-warning flex-fill" [disabled]="loading || avisForm.invalid">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
            <i *ngIf="!loading" class="bi bi-send me-1"></i>
            {{ loading ? 'Envoi...' : 'Soumettre' }}
          </button>
          <button type="button" class="btn btn-outline-secondary" (click)="close.emit()">Annuler</button>
        </div>
      </form>
    </div>
  </div>
</div>
