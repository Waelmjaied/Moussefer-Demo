<!-- Mobile hamburger -->
<button class="sidebar-toggle" [class.hidden]="sidebarOpen" (click)="toggleSidebar()" aria-label="Ouvrir le menu">
  <span></span>
  <span></span>
  <span></span>
</button>

<!-- Backdrop overlay -->
<div class="sidebar-overlay" [class.mobile-open]="sidebarOpen" (click)="closeSidebar()"></div>

<div class="organizer-sidebar" [class.mobile-open]="sidebarOpen">
  <!-- Logo -->
  <div class="sidebar-logo">
    <img src="assets/logo-removebg-preview.png" alt="Moussefer" class="logo-img">
  </div>

  <!-- PRINCIPAL -->
  <div class="sidebar-title">PRINCIPAL</div>
  <ul class="nav flex-column">
    <li class="nav-item">
      <a class="nav-link" routerLink="/organizer/dashboard" routerLinkActive="active" (click)="closeSidebar()">
        <i class="bi bi-bar-chart-line"></i> Vue d'ensemble
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link d-flex align-items-center justify-content-between" routerLink="/organizer/reservations" routerLinkActive="active" (click)="closeSidebar()">
        <span><i class="bi bi-calendar-check"></i> Réservations</span>
        <span class="nav-badge" *ngIf="reservationCount > 0">{{ reservationCount }}</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" routerLink="/organizer/my-voyages" routerLinkActive="active" (click)="closeSidebar()">
        <i class="bi bi-map"></i> Voyages organisés
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" routerLink="/organizer/messages" routerLinkActive="active" (click)="closeSidebar()">
        <i class="bi bi-chat-dots"></i> Messages
      </a>
    </li>
  </ul>

  <!-- GESTION -->
  <div class="sidebar-title">GESTION</div>
  <ul class="nav flex-column">
    <li class="nav-item">
      <a class="nav-link" routerLink="/organizer/finances" routerLinkActive="active" (click)="closeSidebar()">
        <i class="bi bi-cash-stack"></i> Finances et factures
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" routerLink="/organizer/promo-codes" routerLinkActive="active" (click)="closeSidebar()">
        <i class="bi bi-ticket-perforated"></i> Codes promo
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" routerLink="/organizer/clients" routerLinkActive="active" (click)="closeSidebar()">
        <i class="bi bi-people"></i> Clients
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" routerLink="/organizer/statistics" routerLinkActive="active" (click)="closeSidebar()">
        <i class="bi bi-graph-up"></i> Statistiques
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" routerLink="/organizer/scan-qr" routerLinkActive="active" (click)="closeSidebar()">
        <i class="bi bi-qr-code-scan"></i> Scanner QR
      </a>
    </li>
  </ul>

  <!-- COMPTE -->
  <div class="sidebar-title">COMPTE</div>
  <ul class="nav flex-column">
    <li class="nav-item">
      <a class="nav-link" routerLink="/organizer/settings" routerLinkActive="active" (click)="closeSidebar()">
        <i class="bi bi-gear"></i> Paramètres
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link logout-link" href="#" (click)="logout(); $event.preventDefault(); closeSidebar()">
        <i class="bi bi-box-arrow-right"></i> Déconnexion
      </a>
    </li>
  </ul>

  <!-- Organizer footer profile -->
  <div class="organizer-footer">
    <div class="separator"></div>
    <div class="profile-container">
      <div class="profile-initials">{{ organizerInitials }}</div>
      <div class="profile-text">
        <div class="profile-name">{{ organizerName }}</div>
        <div class="profile-status">
          <span class="status-dot"></span> {{ organizerRole }}
        </div>
      </div>
    </div>
  </div>
</div>
