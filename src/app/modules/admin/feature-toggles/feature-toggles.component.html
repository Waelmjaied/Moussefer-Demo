<div class="admin-dashboard">
  <div class="container-fluid">
    <div class="row">
      <app-admin-sidebar></app-admin-sidebar>
      <div class="col-md-9 col-lg-10 ms-sm-auto px-md-4">

        <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
          <div>
            <h1 class="h2"><i class="bi bi-toggles me-2"></i>Feature Toggles</h1>
            <p class="text-muted small mb-0">
              Activer / désactiver les fonctionnalités en temps réel — SUPER_ADMIN uniquement
            </p>
          </div>
          <button class="btn btn-outline-secondary btn-sm" (click)="load()">
            <i class="bi bi-arrow-clockwise me-1"></i>Actualiser
          </button>
        </div>

        <div *ngIf="loading" class="text-center py-5"><div class="spinner-border text-primary"></div></div>

        <div class="row g-3" *ngIf="!loading">
          <div class="col-md-6 col-lg-4" *ngFor="let f of features">
            <div class="card h-100"
                 [class.border-success]="f.enabled"
                 [class.border-secondary]="!f.enabled"
                 [class.border-opacity-50]="true">
              <div class="card-body d-flex justify-content-between align-items-start">
                <div class="flex-grow-1 me-2">
                  <h6 class="card-title mb-1" [class.text-success]="f.enabled" [class.text-muted]="!f.enabled">
                    {{ formatName(f.featureName) }}
                  </h6>
                  <p *ngIf="f.description" class="card-text small text-muted mb-0">
                    {{ f.description }}
                  </p>
                  <p *ngIf="f.updatedAt" class="text-muted mb-0" style="font-size:10px">
                    <i class="bi bi-clock me-1"></i>{{ f.updatedAt | date:'dd/MM/yyyy HH:mm' }}
                  </p>
                </div>

                <div class="form-check form-switch mt-1 flex-shrink-0">
                  <input class="form-check-input"
                         type="checkbox"
                         role="switch"
                         [id]="'ft-' + f.featureName"
                         [checked]="f.enabled"
                         [disabled]="!permissionService.isSuperAdmin() || updating === f.featureName"
                         (change)="toggle(f)"
                         style="width:2.5em;height:1.25em;cursor:pointer">
                  <span *ngIf="updating === f.featureName" class="spinner-border spinner-border-sm ms-1 text-secondary"></span>
                </div>
              </div>

              <div class="card-footer py-1 text-end" style="font-size:10px">
                <span class="badge"
                      [class.bg-success]="f.enabled"
                      [class.bg-secondary]="!f.enabled">
                  {{ f.enabled ? 'ACTIF' : 'INACTIF' }}
                </span>
              </div>
            </div>
          </div>

          <div *ngIf="features.length === 0" class="col-12 text-center text-muted py-5">
            Aucun feature toggle configuré.
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
